# Build the static site and rsync it to the VPS.
# Needs three repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST     — server IP or hostname
#   VPS_USER     — the deploy user (e.g. "deploy")
#   VPS_SSH_KEY  — private key whose public half is in the deploy user's authorized_keys
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # .npmrc already disables lifecycle scripts; frozen lockfile means CI
      # installs exactly what was audited locally.
      - run: pnpm install --frozen-lockfile

      # SITE_URL is a repository *variable* (Settings → Secrets and variables →
      # Actions → Variables): the canonical origin, e.g. https://example.com.
      # Used for hreflang, sitemap, and OpenGraph absolute URLs.
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" out/ "$USER@$HOST:/srv/mysite/site/"
